[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legacy-lens"
version = "1.0.0"
description = "Radiografia de un sistema legacy PHP/MySQL: esquema, codigo, secretos y cuanto duele migrarlo."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Luca Baello" }]
keywords = ["legacy", "php", "mysql", "migration", "audit", "cli", "laravel"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
mysql = ["pymysql>=1.1"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
legacy-lens = "legacy_lens.cli:main"

[project.urls]
Homepage = "https://github.com/lucabaello1998/legacy-lens"

[tool.hatch.build.targets.wheel]
packages = ["legacy_lens"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
