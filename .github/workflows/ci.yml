name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build de la imagen
        run: docker build -t legacy-lens:ci .
      - name: Escanear el ejemplo dentro del contenedor
        run: |
          mkdir -p out
          docker run --rm -v "$PWD/examples:/work:ro" -v "$PWD/out:/out" legacy-lens:ci \
            scan --path /work/tienda-legacy/app --dump /work/tienda-legacy/schema.sql --out /out --quiet
          test -s out/report.html
